name: 构建并发布镜像

# 同一镜像同时用作 Console 和 Agent，靠 FRPC_MULTI_ROLE 区分角色。
# 推送到 main 或打 tag 时构建多架构镜像并发布到 GHCR。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 镜像名固定用仓库 owner（小写）+ frpc-multi，与一键安装命令默认值一致。
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: 发布前自动化测试门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统探测依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mtr-tiny

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: webui/backend/requirements.txt

      - name: 运行后端单元测试
        env:
          PROJECT_DIR: /tmp/frpc-multi-ci
          WEBUI_JWT_SECRET: ci-test-secret-key-for-unit-tests-32c
        run: |
          python -m pip install -r webui/backend/requirements.txt
          cd webui/backend && python -m unittest discover -s tests

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webui/frontend/package-lock.json

      - name: 运行前端单测与构建校验
        working-directory: webui/frontend
        run: |
          npm ci
          npm test
          npm run build

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（多架构）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 计算版本号
        run: echo "AGENT_VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./webui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: AGENT_VERSION=${{ env.AGENT_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
